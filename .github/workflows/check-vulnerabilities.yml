name: Trivy Image Scan
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: 
    inputs:
      target:
        required: false
        type: string
        default: "all"
jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to fetch tags
      - name: Find latest versions
        id: find-versions          
        run: |
          if [ -z "${{ inputs.target }}" ] || [ "${{ inputs.target }}" = "all" ]; then
            echo "images=$(.github/cicd/find-images.sh)" >> $GITHUB_OUTPUT
          else
            echo 'images=["${{ inputs.target }}"]' >> $GITHUB_OUTPUT
          fi
    outputs:
      images: ${{ steps.find-versions.outputs.images }}
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      security-events: write  # Required to upload SARIF files to Security tab
    if: ${{ needs.setup.outputs.images != '[]' && needs.setup.outputs.images != '' }}
    strategy:
      matrix:
        image: ${{ fromJson(needs.setup.outputs.images) }}
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "ghcr.io/ndrscodes/hardened-images/${{ matrix.image }}"
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'